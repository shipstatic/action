name: 'ShipStatic'
description: 'Deploy static websites, landing pages, and prototypes to ShipStatic from CI'
branding:
  icon: 'upload-cloud'
  color: 'blue'

inputs:
  token:
    description: 'ShipStatic token — an API key (ship-…) or a deploy token (deploy-…). Omit to deploy anonymously: the site is public, expires, and can be claimed.'
    required: false
  api-url:
    description: 'ShipStatic API endpoint. Defaults to the production API.'
    required: false
  path:
    description: 'Directory to deploy'
    required: false
    default: '.'
  domain:
    description: 'Domain to link to the deployment (requires token)'
    required: false
  password:
    description: 'Password-protect the deployment (6–128 characters; whitespace significant). Visitors are prompted to unlock before viewing.'
    required: false
  labels:
    description: 'Comma-separated labels for the deployment. The commit short SHA is always applied; these are added to it.'
    required: false
  idempotency-key:
    description: 'Override the derived idempotency key. Defaults to this workflow run + job, so re-running a job replays the original deployment instead of deploying twice. Set one per matrix leg when legs deploy different content.'
    required: false
  github-token:
    description: 'GitHub token for PR comments and deployment tracking'
    required: false

outputs:
  deployment:
    description: 'Deployment hostname (e.g. happy-cat-abc1234.shipstatic.com)'
    value: ${{ steps.deploy.outputs.deployment }}
  url:
    description: 'Deployment URL'
    value: ${{ steps.deploy.outputs.url }}
  claim:
    description: 'Claim URL — set for anonymous deployments only (visit to keep permanently)'
    value: ${{ steps.deploy.outputs.claim }}
  expires:
    description: 'Expiry as a unix timestamp in seconds — set for anonymous deployments only'
    value: ${{ steps.deploy.outputs.expires }}

runs:
  using: 'composite'
  steps:
    # MAJORS PIN MAJORS. An action whose interface is a contract with a CLI must
    # name the CLI major it speaks: `@v2` speaks ship 2.x, and this line says so
    # in bytes. `@latest` here would put whatever the registry serves this minute
    # inside every consumer's workflow — and the 2.x CLI does not read the 1.x
    # credential variable, so a float across that boundary turns an authenticated
    # deploy into a silent anonymous one. `.github/workflows/ci.yml` fences the
    # major.
    - name: Install ShipStatic CLI
      shell: bash
      run: npm install -g @shipstatic/ship@2

    - name: Deploy
      id: deploy
      shell: bash
      env:
        SHIP_TOKEN: ${{ inputs.token }}
        SHIP_API_URL: ${{ inputs.api-url }}
        SHIP_PASSWORD: ${{ inputs.password }}
        SHIP_VIA: git
        DEPLOY_PATH: ${{ inputs.path }}
        DOMAIN: ${{ inputs.domain }}
        LABELS: ${{ inputs.labels }}
        IDEMPOTENCY_KEY: ${{ inputs.idempotency-key }}
        GIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      run: |
        # The CLI normalizes an empty value to absence itself; this is defense
        # in depth for whatever CLI the pin above resolves.
        if [ -z "$SHIP_PASSWORD" ]; then unset SHIP_PASSWORD; fi

        # Key the ATTEMPT, never the try. GITHUB_RUN_ID is stable across
        # re-runs and fresh per push, so pressing "re-run jobs" replays the
        # original 201 instead of deploying twice; the job is part of the key
        # because two jobs in one run may deploy two different sites, and the
        # repository is part of it because GitHub only guarantees a run id
        # unique WITHIN a repository — anonymous deploys share a replay
        # namespace keyed by the runner's egress IP, which every repository on
        # a hosted runner shares.
        if [ -z "$IDEMPOTENCY_KEY" ]; then
          IDEMPOTENCY_KEY="${GITHUB_REPOSITORY}-${GITHUB_RUN_ID}-${GITHUB_JOB}"
        fi
        export SHIP_IDEMPOTENCY_KEY="$IDEMPOTENCY_KEY"

        # The commit short SHA is ambient attempt metadata, applied like
        # SHIP_VIA and the key above: read from the context, never asked for.
        # The user's labels are appended; the CLI validates each one and its
        # message relays, so there is no second validator here.
        ARGS=(--label "${GIT_SHA:0:7}")
        if [ -n "$LABELS" ]; then
          IFS=',' read -ra PARTS <<< "$LABELS"
          for part in "${PARTS[@]}"; do
            # `read` strips surrounding whitespace, so `a, b` and `a,b` agree.
            # Only the edges — a label with inner whitespace is invalid and must
            # reach the CLI to be refused by name, not be silently repaired.
            read -r part <<< "$part"
            if [ -n "$part" ]; then ARGS+=(--label "$part"); fi
          done
        fi

        OUTPUT=$(ship "$DEPLOY_PATH" "${ARGS[@]}" --json --no-color)

        # Every value is read off the wire. `url` in particular is NOT
        # reassembled from the hostname: the response owns its own URL, and a
        # client that rebuilds one is a client that disagrees with the platform
        # the day the shape changes.
        DEPLOYMENT=$(jq -r '.deployment // empty' <<< "$OUTPUT")
        URL=$(jq -r '.url // empty' <<< "$OUTPUT")
        CLAIM=$(jq -r '.claim // empty' <<< "$OUTPUT")
        EXPIRES=$(jq -r '.expires // empty' <<< "$OUTPUT")

        # The expiry is rendered HERE, where the timestamp is read, and the PR
        # comment consumes the rendered string rather than repeating the
        # incantation. One `date` invocation in this file, one owner. A
        # relative duration would be stale the moment it is read; this is the
        # wire's own `expires` as a real date.
        EXPIRES_AT=""
        if [ -n "$EXPIRES" ]; then
          EXPIRES_AT=$(date -u -d "@$EXPIRES" '+%-d %B %Y, %H:%M UTC' 2>/dev/null \
                    || date -u -r "$EXPIRES" '+%-d %B %Y, %H:%M UTC')
        fi

        {
          echo "deployment=$DEPLOYMENT"
          echo "url=$URL"
          echo "claim=$CLAIM"
          echo "expires=$EXPIRES"
          echo "expires-at=$EXPIRES_AT"
        } >> "$GITHUB_OUTPUT"

        # The run page says what happened, and the ACTION says it — otherwise
        # every serious consumer writes this table itself, which is exactly
        # what happened before this existed. `$GITHUB_STEP_SUMMARY` is the
        # first-party furniture of the era (`actions/deploy-pages`,
        # `attest-build-provenance`), and it is inert: no opt-out knob, since
        # nothing downstream can depend on it.
        #
        # It lives INSIDE this step rather than in a sixth one. Each step gets
        # its own summary FILE and the job concatenates them, so a table split
        # across two steps would not render as one table — and the five-step
        # shape is fenced, so a step is a design change rather than an edit.
        # `domain` is therefore the input, not a wire value: the link happens
        # one step later, and a failed link fails the job loudly beneath this.
        #
        # Every row is an `if`, never `[ -n "$X" ] && echo`: a trailing test
        # that fails is the block's exit status under `bash -e`.
        {
          echo "| | |"
          echo "|---|---|"
          echo "| Deployment | \`$DEPLOYMENT\` |"
          echo "| URL | $URL |"
          if [ -n "$DOMAIN" ]; then
            echo "| Domain | https://$DOMAIN |"
          fi
          if [ -n "$CLAIM" ]; then
            echo "| Claim | $CLAIM |"
            echo "| Expires | $EXPIRES_AT |"
          fi
        } >> "$GITHUB_STEP_SUMMARY"

    - name: Link domain
      if: ${{ inputs.token != '' && inputs.domain != '' && steps.deploy.outputs.deployment != '' }}
      shell: bash
      env:
        SHIP_TOKEN: ${{ inputs.token }}
        SHIP_API_URL: ${{ inputs.api-url }}
        DOMAIN: ${{ inputs.domain }}
        DEPLOYMENT: ${{ steps.deploy.outputs.deployment }}
      run: ship domains set "$DOMAIN" "$DEPLOYMENT" --json --no-color

    - name: Create GitHub deployment
      if: ${{ inputs.github-token != '' && steps.deploy.outputs.url != '' }}
      continue-on-error: true
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        GH_REPO: ${{ github.repository }}
        GH_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        GH_EVENT: ${{ github.event_name }}
        DEPLOY_URL: ${{ steps.deploy.outputs.url }}
      run: |
        ENVIRONMENT=$([[ "$GH_EVENT" == "pull_request" ]] && echo "preview" || echo "production")
        PAYLOAD=$(jq -n --arg ref "$GH_SHA" --arg env "$ENVIRONMENT" \
          '{ref: $ref, environment: $env, auto_merge: false, required_contexts: []}')
        ID=$(echo "$PAYLOAD" | gh api "repos/$GH_REPO/deployments" --input - --jq '.id')
        gh api "repos/$GH_REPO/deployments/$ID/statuses" \
          -f state=success \
          -f environment_url="$DEPLOY_URL"

    - name: Comment on PR
      if: ${{ inputs.github-token != '' && steps.deploy.outputs.url != '' && github.event_name == 'pull_request' }}
      continue-on-error: true
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        GH_REPO: ${{ github.repository }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        DEPLOY_URL: ${{ steps.deploy.outputs.url }}
        CLAIM_URL: ${{ steps.deploy.outputs.claim }}
        EXPIRES_AT: ${{ steps.deploy.outputs.expires-at }}
      run: |
        # One comment per PR, updated in place on every push. The marker is what
        # makes that safe: `gh pr comment --edit-last` edits the authenticated
        # identity's last comment WHATEVER wrote it, so on a PR where another
        # workflow also comments as github-actions[bot] the two clobber each
        # other. Finding our own comment by marker cannot.
        MARKER='<!-- shipstatic/action -->'

        # The expiry is the wire's `expires`, rendered as a real date by the
        # deploy step and read back here. A hand-written "expires in 3 days" is
        # stale the moment it is read, and this file has no compiler and no
        # test runner to hold a copy honest — the only duration it can state
        # truthfully forever is one it read off the response.
        NOTE=""
        if [ -n "$EXPIRES_AT" ]; then
          NOTE="Expires $EXPIRES_AT — [claim this deployment]($CLAIM_URL) to keep it."
        fi

        if [ -n "$NOTE" ]; then
          BODY=$(printf '%s\nDeployed to %s\n\n%s' "$MARKER" "$DEPLOY_URL" "$NOTE")
        else
          BODY=$(printf '%s\nDeployed to %s' "$MARKER" "$DEPLOY_URL")
        fi

        # Collected into a variable rather than piped into `head`: closing the
        # pipe early would SIGPIPE `gh` and, under `pipefail`, fail the step.
        FOUND=$(gh api --paginate "repos/$GH_REPO/issues/$PR_NUMBER/comments" \
          --jq ".[] | select(.body | startswith(\"$MARKER\")) | .id")
        ID=$(printf '%s\n' "$FOUND" | head -1)

        if [ -n "$ID" ]; then
          gh api --silent -X PATCH "repos/$GH_REPO/issues/comments/$ID" -f body="$BODY"
        else
          gh api --silent "repos/$GH_REPO/issues/$PR_NUMBER/comments" -f body="$BODY"
        fi
